<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Расписание</title>
<style>
:root{
 --bg:#08090b; --card:#202125; --card-side:#292a30; --panel:#2c2d32;
 --text:#f4f4f6; --muted:#9b9ba2; --blue:#7799ff; --orange:#ff7900; --red:#f05260;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
html,body{height:100%;overflow:hidden}
body{min-height:100vh}
.app{max-width:430px;height:100dvh;margin:auto;padding:0 15px 90px;display:flex;flex-direction:column;overflow:hidden;position:relative}
.header{
height:70px;
display:flex;
align-items:center;
justify-content:space-between;
padding-top:0;
}
.avatar{
width:39px;height:39px;border-radius:50%;
background:#914000;display:grid;place-items:center;
font-weight:750;font-size:17px;position:relative;
}
.avatar:after{content:"";width:9px;height:9px;border-radius:50%;background:#8e9098;position:absolute;right:0;bottom:2px;border:2px solid var(--bg)}
.header-icons{display:flex;gap:18px;align-items:center;font-size:22px}
.bell{position:relative}.badge{position:absolute;right:-7px;top:-8px;background:#df3848;border-radius:20px;font-size:10px;padding:2px 5px}
.week{
display:grid;grid-template-columns:repeat(7,1fr);
text-align:center;color:#96979d;
margin:0 0 12px;
}
.day{cursor:pointer;padding:0}
.dow{font-size:13px;line-height:18px}
.num{
width:31px;height:31px;margin:5px auto 0;
display:grid;place-items:center;font-size:17px;
color:#eee;border-radius:50%;
}.day.active .num{background:#526fea}.day.sun .num{color:#f15b65}
.toolbar{
display:flex;align-items:center;gap:11px;
margin:0 0 7px;
min-height:45px;
}
.pill{
height:31px;
display:inline-flex;align-items:center;justify-content:center;
background:#2b2c31;border:0;color:#f7f7f8;
font:700 15px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
border-radius:8px;padding:0 11px;cursor:pointer;
}
.spacer{flex:1}.iconbtn{width:43px;min-width:43px;padding:0}
.schedule{
flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
padding:2px 0 22px;-webkit-overflow-scrolling:touch;
overscroll-behavior-y:contain;touch-action:pan-y;
scrollbar-width:thin;position:relative;z-index:1
}
.card{background:var(--card);border-radius:17px;padding:18px 27px;margin:8px 0;position:relative;overflow:hidden;cursor:pointer}
.card:before{content:"";position:absolute;left:0;top:15px;width:8px;height:52px;background:var(--card-side);border-radius:0 8px 8px 0}
.card.current{border:2px solid var(--blue);padding:16px 25px}
.card.current:before{background:#9099b4}
.meta{font-size:14px;color:#9c9da3;display:flex;gap:8px;flex-wrap:wrap}
.subject{font-size:16px;font-weight:720;color:#9c9ca2;margin:9px 0 24px;line-height:1.35}
.current .subject,.current .home-title{color:#fff}
.home-title{font-size:15px;font-weight:700;color:#a7a8ae;margin-bottom:7px}
.home{font-size:14px;color:#96979c;line-height:1.35}
.todo{font-size:14px;color:#a2a3a8;margin-top:7px}.todo.orange{color:var(--orange)}
.break{height:34px;padding:7px 3px;display:flex;align-items:center;justify-content:space-between;color:#98999f;font-size:14px}
.grade{position:absolute;right:15px;top:14px;background:#303137;border-radius:13px;width:39px;height:36px;display:grid;place-items:center;font-weight:700;font-size:17px}.grade small{font-size:9px;position:absolute;right:7px;bottom:4px;font-weight:400}
.replace{font-weight:700;font-size:12px;margin-right:5px}
.bottom{position:fixed;z-index:8;bottom:0;left:0;right:0;height:90px;padding-bottom:env(safe-area-inset-bottom);background:#2b2c31;border-top:1px solid #4a4b50;display:flex;justify-content:center}
.bottom-inner{width:min(430px,100%);display:grid;grid-template-columns:repeat(5,1fr);align-items:center}.nav{text-align:center;color:#9fa0a6;font-size:11px}.nav i{display:block;font-style:normal;font-size:22px;margin-bottom:5px}.nav.active{color:#fff}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:20;align-items:flex-end}.modal.show{display:flex}
.sheet{background:#25262b;width:min(430px,100%);margin:auto;border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.sheet h2{font-size:21px;margin:0 0 16px}.sheet label{display:block;color:#aaa;font-size:13px;margin:11px 0 5px}.sheet input,.sheet textarea{width:100%;border:0;background:#34353b;color:#fff;border-radius:10px;padding:11px;font-size:16px}.sheet textarea{min-height:90px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sheet-actions{display:flex;gap:8px;margin-top:17px}.save,.cancel,.delete{border:0;border-radius:10px;padding:11px 13px;color:#fff;font-weight:700}.save{background:#526fea;flex:1}.cancel{background:#3a3b41}.delete{background:#9c3540}
.empty{height:100%;min-height:430px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#8f9096;padding:25px 0}
.empty-face{font-size:54px;color:#ffc83d;margin-bottom:20px}
.empty b{font-size:18px;color:#f3f3f5}.empty p{font-size:15px;line-height:1.45;margin:12px 0 25px}
.create-event{width:100%;border:0;border-radius:13px;background:#292a2f;color:#5578f6;font-size:17px;font-weight:700;padding:15px;cursor:pointer}
</style>

<style>
/* Верхняя область вообще не участвует в прокрутке */
.fixed-top{
  flex:0 0 auto;
  position:relative;
  z-index:20;
  background:#08090b;
  padding-top:4px;
}
.fixed-top .header,.fixed-top .week,.fixed-top .toolbar{flex-shrink:0}

/* Скролл только здесь — карточки уходят под верхнюю панель */
.schedule::-webkit-scrollbar{width:3px}
.schedule::-webkit-scrollbar-track{background:transparent}
.schedule::-webkit-scrollbar-thumb{background:#8d8e94;border-radius:10px}
body{overscroll-behavior:none}

/* нижняя панель всегда поверх списка */
.bottom{z-index:30}
</style>


<style>
/* v5: tighter, higher and cleaner fixed header */
.fixed-top{
  padding-top:max(2px, env(safe-area-inset-top, 0px)) !important;
  background:#08090b;
  z-index:40;
}
.app{
  padding-left:15px;
  padding-right:15px;
}
.header-icons{
  color:#e8e8eb;
  font-size:20px;
  gap:17px;
}
.bell{color:#d8d9dd}
.week,.toolbar,.header{position:relative;z-index:42}
.schedule{
  z-index:1;
  padding-top:1px;
  scroll-padding-top:0;
}
.fixed-top:after{
  content:"";
  position:absolute;
  left:-15px;right:-15px;bottom:-8px;
  height:8px;
  background:linear-gradient(to bottom,#08090b,rgba(8,9,11,0));
  pointer-events:none;
}
.bottom{z-index:50}
</style>


<style>
.ico{width:1em;height:1em;display:inline-block;vertical-align:-.15em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.header-icons .ico{width:23px;height:23px}
.home-title .ico{width:17px;height:17px;margin-right:7px;color:inherit}
.break .ico{width:19px;height:19px;margin-right:7px;color:#9b9ca2}
.replace .ico{width:16px;height:16px;margin-right:5px}
.nav .ico{display:block;width:27px;height:27px;margin:0 auto 5px;stroke-width:1.7}
.nav.active .ico{stroke-width:2.1}
.iconbtn .ico{width:21px;height:21px;color:#d7d8dc}
.pdf-label{position:absolute;font-size:7px;font-weight:800;color:#fff;background:#e63b4c;border-radius:2px;padding:1px 2px;transform:translate(4px,7px)}
.iconbtn{position:relative}
.pill{box-shadow:none}
.toolbar .pill:active{transform:scale(.97);background:#34353b}
.card{transition:background .12s ease,border-color .12s ease}
.card:active{background:#24252a}
</style>


<style>
.mesh-walker{
  width:20px !important;
  height:20px !important;
  margin-right:7px;
  color:#9b9ca2;
  fill:none;
  stroke:currentColor;
  stroke-width:1.85;
  stroke-linecap:round;
  stroke-linejoin:round;
  vertical-align:-4px;
  flex:0 0 auto;
}
.mesh-walker circle{
  fill:currentColor;
  stroke:none;
}
</style>


<style>
/* v8 — stories in the center of the top panel; all other UI unchanged */
.header{position:relative}
.stories{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  display:flex;
  align-items:center;
  gap:0;
  height:34px;
  z-index:3;
}
.story{
  position:relative;
  width:31px;
  height:31px;
  padding:0;
  margin:0 -1px;
  overflow:hidden;
  border-radius:8px;
  border:1.25px solid #7b65ff;
  background:#18284e;
  box-shadow:
    0 0 0 .55px #20a6cf inset,
    0 0 0 .4px rgba(255,73,214,.85);
  appearance:none;
  -webkit-appearance:none;
}
.story-art{position:absolute;inset:1px;border-radius:6px;overflow:hidden}

/* blue map tile */
.story-map .story-art{
  background:linear-gradient(145deg,#173f77 0%,#24518c 55%,#172f5b 100%);
}
.map-land{position:absolute;background:#e7a929;filter:saturate(1.05)}
.land-a{width:13px;height:8px;left:3px;top:4px;border-radius:60% 35% 55% 40%;transform:rotate(-10deg)}
.land-b{width:10px;height:11px;right:3px;top:9px;border-radius:45% 60% 35% 55%;transform:rotate(18deg)}
.map-dot{position:absolute;width:3px;height:3px;border-radius:50%;background:#f0c441;left:15px;bottom:5px}

/* purple notebook tile */
.story-book .story-art{
  background:linear-gradient(180deg,#a8a0ff 0%,#7467e9 100%);
}
.book-page{
  position:absolute;left:6px;top:4px;width:17px;height:21px;
  border-radius:2px 4px 4px 2px;
  background:linear-gradient(90deg,#eeeaff,#c9c2ef);
  transform:rotate(-5deg);
  box-shadow:-2px 0 0 rgba(57,44,118,.35);
}
.book-page:after{
  content:"";position:absolute;left:3px;right:3px;top:6px;height:1px;
  background:#a39cc9;box-shadow:0 4px #aaa2cf,0 8px #aaa2cf;
}
.book-mark{position:absolute;width:4px;height:9px;background:#8775c9;right:6px;top:5px;transform:rotate(-5deg)}

/* teal clock/paper tile */
.story-clock .story-art{
  background:linear-gradient(145deg,#3c665f 0%,#193e45 100%);
}
.paper{
  position:absolute;width:18px;height:24px;left:4px;top:2px;
  background:#d8c39f;border-radius:2px;transform:rotate(-9deg);
  box-shadow:0 1px 3px #0005;
}
.clock-face{
  position:absolute;width:17px;height:17px;right:2px;top:6px;
  border-radius:50%;background:#cbb98e;border:1.4px solid #66563d;
  box-shadow:0 0 0 1px #e2d1a7 inset;
}
.clock-face:after{
  content:"";position:absolute;width:2px;height:2px;border-radius:50%;
  background:#574a38;left:6px;top:6px;
}
.clock-hand{position:absolute;background:#574a38;transform-origin:bottom center;left:6.5px;bottom:8px;border-radius:2px}
.clock-hand.h1{width:1px;height:5px;transform:rotate(8deg)}
.clock-hand.h2{width:1px;height:4px;transform:rotate(105deg)}
</style>


<style>
.card.past{opacity:.58;filter:saturate(.72)}
.card.past .subject,.card.past .home-title{color:#b3b3b8}
.card.current{
  opacity:1!important;filter:none!important;
  border:2px solid #7d9cff!important;
  padding:16px 25px!important;
}
.card.current:before{background:#929bb5!important}
</style>


<style>
.sheet{border:1px solid #3b3c42;box-shadow:0 -18px 55px #0009}
.sheet:before{content:"";display:block;width:42px;height:5px;border-radius:10px;background:#666870;margin:-9px auto 13px}
.sheet input,.sheet textarea{outline:none;border:1px solid transparent}
.sheet input:focus,.sheet textarea:focus{border-color:#607ff1;background:#393a41}
.sheet-actions{position:sticky;bottom:0;background:#25262b;padding-top:10px}
#duplicateBtn{display:none}
</style>


<style>
/* v10 — точная логика состояния уроков */
.card{opacity:1;filter:none}
.card.past{
  opacity:.56;
  filter:saturate(.68);
  border-color:transparent;
}
.card.current{
  opacity:1!important;
  filter:none!important;
  border:2px solid #7d9cff!important;
  padding:16px 25px!important;
}
.card.current .subject,
.card.current .home-title{color:#fff!important}
.card:not(.past):not(.current){
  opacity:1!important;
  filter:none!important;
}
</style>


<style>
/* v11 — состояние ВСЕЙ карточки, а не только текста */
.card{
  opacity:1!important;
  filter:none!important;
  border:2px solid transparent;
  padding:16px 25px;
}
.card:not(.past):not(.current){
  background:#202125!important;
  border-color:transparent!important;
}
.card:not(.past):not(.current) .subject,
.card:not(.past):not(.current) .home-title{
  color:#f4f4f6!important;
}
.card:not(.past):not(.current) .meta,
.card:not(.past):not(.current) .home{
  color:#9b9ba2!important;
}

.card.past{
  opacity:1!important;
  filter:none!important;
  background:#191a1e!important;
  border-color:transparent!important;
}
.card.past:before{background:#24252a!important}
.card.past .subject,
.card.past .home-title,
.card.past .meta,
.card.past .home,
.card.past .todo{
  color:#74757b!important;
}

.card.current{
  opacity:1!important;
  filter:none!important;
  background:#202125!important;
  border:2px solid #7d9cff!important;
  box-shadow:0 0 0 1px rgba(125,156,255,.08) inset;
}
.card.current:before{background:#929bb5!important}
.card.current .subject,
.card.current .home-title{color:#fff!important}
.card.current .meta,
.card.current .home{color:#a5a6ac!important}
</style>

</head>
<body>
<div class="app">
 <div class="fixed-top">
<header class="header">
   <div class="avatar">ДИ</div>

   <div class="stories" aria-label="Истории">
     <button class="story story-map" aria-label="История 1">
       <span class="story-art">
         <span class="map-land land-a"></span>
         <span class="map-land land-b"></span>
         <span class="map-dot"></span>
       </span>
     </button>
     <button class="story story-book" aria-label="История 2">
       <span class="story-art">
         <span class="book-page"></span>
         <span class="book-mark"></span>
       </span>
     </button>
     <button class="story story-clock" aria-label="История 3">
       <span class="story-art">
         <span class="paper"></span>
         <span class="clock-face">
           <span class="clock-hand h1"></span>
           <span class="clock-hand h2"></span>
         </span>
       </span>
     </button>
   </div>

   <div class="header-icons">
<span class="bell">
<svg class="ico" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>
<b class="badge">1</b></span>
<span><svg class="ico" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></span>
</div>
 </header>

 <div class="week" id="week"></div>

 <div class="toolbar">
   <button class="pill">Сентябрь</button>
   <button class="pill" onclick="selected=28;render()">Сегодня</button>
   <span class="spacer"></span>
   <button class="pill iconbtn" aria-label="PDF">
<svg class="ico" viewBox="0 0 24 24"><path d="M6 2h8l4 4v16H6z"/><path d="M14 2v5h5"/></svg>
<span class="pdf-label">PDF</span></button>
   <button class="pill iconbtn" onclick="openEditor()" aria-label="Меню">
<svg class="ico" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1" fill="currentColor" stroke="none"/></svg>
</button>
 </div>

 </div>

 <main class="schedule" id="schedule"></main>
</div>

<nav class="bottom">
 <div class="bottom-inner">
  <div class="nav active"><svg class="ico" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="7" rx="1"/><rect x="5" y="14" width="14" height="7" rx="1"/></svg>Расписание</div>
  <div class="nav"><svg class="ico" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3l-5.6 2.9 1.1-6.2L3 9.6l6.2-.9z"/></svg>Оценки</div>
  <div class="nav"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="m8.5 12 2.2 2.2 4.8-5"/></svg>Задания</div>
  <div class="nav"><svg class="ico" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>Школа</div>
  <div class="nav"><svg class="ico" viewBox="0 0 24 24"><path d="M6 8h12a2 2 0 0 1 2 2v9H4v-9a2 2 0 0 1 2-2z"/><path d="M9 8V5h6v3"/></svg>Портфолио</div>
 </div>
</nav>

<div class="modal" id="modal" onclick="if(event.target===this)closeEditor()">
 <div class="sheet">
  <h2 id="formTitle">Изменить урок</h2>
  <label>Предмет</label><input id="subject">
  <div class="row">
   <div><label>Начало</label><input id="start" type="time"></div>
   <div><label>Конец</label><input id="end" type="time"></div>
  </div>
  <label>Кабинет</label><input id="room">
  <label>Домашнее задание</label><textarea id="homework"></textarea>
  <label>Статус / дополнительная строка</label><input id="note">
  <div class="sheet-actions">
   <button class="delete" id="deleteBtn" onclick="removeLesson()">Удалить</button>
   <button class="cancel" id="duplicateBtn" onclick="duplicateLesson()">Дублировать</button>
   <button class="cancel" onclick="closeEditor()">Отмена</button>
   <button class="save" onclick="saveLesson()">Сохранить</button>
  </div>
 </div>
</div>

<script>
const days=[["Пн",21],["Вт",22],["Ср",23],["Чт",24],["Пт",25],["Сб",26],["Вс",27]];
let selected=24, editing=null;

/* Расписание со скриншотов. Последний урок можно удалить/вернуть через редактор. */
const initial={
24:[
 {n:1,start:"08:00",end:"08:45",room:"506",subject:"Группа «Россия - мои горизонты» 9 класс 25",homework:"Внеурочная деятельность",note:"",type:"extra"},
 {n:2,start:"08:55",end:"09:40",room:"202",subject:"Биология",homework:"Выполнить тест ЦДЗ, подготовиться к СР на 10 баллов по темам параграфов 1-4 и 6.",note:"1 для выполнения"},
 {n:3,start:"10:00",end:"10:45",room:"208",subject:"Русский язык",homework:"Файл прикреплен. Сократить текст до размера 70-90 слов. Выделить 3 абзаца, уметь определить...",note:"",replace:true},
 {n:4,start:"10:55",end:"11:40",room:"100",subject:"Физическая культура",homework:"Домашнее задание не задано",note:""},
 {n:5,start:"11:50",end:"12:35",room:"207",subject:"Геометрия",homework:"Повторить по тетради пройденный материал. Выполнить тест.",note:"2 для изучения  1 для выполнения"},
 {n:6,start:"12:55",end:"13:40",room:"302",subject:"География",homework:"Цифровое домашнее задание",note:"1 для выполнения",grade:"3"},
 {n:7,start:"13:50",end:"14:35",room:"502",subject:"Химия",homework:"Закончить конспект параграфа №2 2) посчитать степени окисления элементов в оксидах калия, ст...",note:"1 для выполнения"},
 {n:8,start:"14:45",end:"15:30",room:"501",subject:"Физика",homework:"Выполнить все упражнения П.П. 9 и 10 и усвоить соответствующий материал по теме - Относитель...",note:"1 для выполнения",current:true}
]};
let data=JSON.parse(localStorage.getItem("meshExactSchedule")||"null")||initial;

function mins(t){let [h,m]=t.split(":").map(Number);return h*60+m}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function persist(){localStorage.setItem("meshExactSchedule",JSON.stringify(data))}
function renderWeek(){
 let e=document.getElementById("week");e.innerHTML="";
 days.forEach(([d,n])=>{
   let x=document.createElement("div");x.className="day "+(n===selected?"active ":"")+(n===27?"sun":"");
   x.innerHTML=`<div class="dow">${d}</div><div class="num">${n}</div>`;
   x.onclick=()=>{selected=n;render()};e.appendChild(x)
 })
}

function updateRealtimeStates(){
 const cards=[...document.querySelectorAll("#schedule .card")];
 const arr=data[selected]||[];
 cards.forEach(c=>c.classList.remove("past","current"));

 const now=new Date();
 const nowMin=now.getHours()*60+now.getMinutes();
 let active=-1;

 // Урок считается текущим с его начала и до начала следующего урока.
 // Поэтому на перемене после Биологии она всё ещё остаётся в синей обводке,
 // как в МЭШ, пока не начнётся следующий урок.
 for(let i=0;i<arr.length;i++){
   const start=mins(arr[i].start);
   const nextStart=i<arr.length-1 ? mins(arr[i+1].start) : mins(arr[i].end);
   if(nowMin>=start && nowMin<nextStart){
     active=i;
     break;
   }
 }

 // Если сейчас непосредственно идёт последний урок.
 if(active<0 && arr.length){
   const last=arr.length-1;
   if(nowMin>=mins(arr[last].start) && nowMin<mins(arr[last].end)) active=last;
 }

 cards.forEach((card,i)=>{
   if(active>=0 && i<active) card.classList.add("past");
   else if(i===active) card.classList.add("current");
   else if(active<0 && mins(arr[i].end)<=nowMin) card.classList.add("past");
   // i > active остаются обычными яркими будущими уроками
 });
}
function render(){
 renderWeek();
 const root=document.getElementById("schedule"), arr=data[selected]||[];root.innerHTML="";
 if(!arr.length){root.innerHTML='<div class="empty"><div class="empty-face">☺</div><b>Уроков и мероприятий нет</b><p>Уроков и мероприятий на этот день<br>не найдено</p><button class="create-event" onclick="openEditor()">⊕ &nbsp; Создать мероприятие</button></div>';return}
 arr.forEach((x,i)=>{
   let c=document.createElement("section");
   c.className="card";
   let head=x.replace?`<span class="replace"><svg class="ico" viewBox="0 0 24 24"><path d="M7 7h10l-3-3M17 17H7l3 3M17 7l3 3-3 3M7 17l-3-3 3-3"/></svg>Замена учителя</span>`:`<span>${x.n||i+1} урок</span>`;
   c.innerHTML=`
    ${x.grade?`<div class="grade">${esc(x.grade)}<small>1</small></div>`:""}
    <div class="meta">${head}<span>${x.start} – ${x.end}</span><span>каб. ${esc(x.room)}</span></div>
    <div class="subject">${esc(x.subject)}</div>
    ${x.type==="extra"
      ?`<div class="home">${esc(x.homework)}</div>`
      :`<div class="home-title"><svg class="ico" viewBox="0 0 24 24"><path d="m4 11 8-7 8 7v9h-6v-6h-4v6H4z"/></svg>Домашнее задание${x.homework==="Домашнее задание не задано"?" не задано":""}</div>
        ${x.homework==="Домашнее задание не задано"?"":`<div class="home">${esc(x.homework)}</div>`}
        ${x.note?`<div class="todo ${x.current?"orange":""}">${esc(x.note)}</div>`:""}`
    }`;
   c.onclick=()=>openEditor(i);root.appendChild(c);
   if(i<arr.length-1){
      const gap=mins(arr[i+1].start)-mins(x.end);
      if(gap>=0){
       let b=document.createElement("div");b.className="break";
       b.innerHTML=`<span><svg class="ico mesh-walker" viewBox="0 0 24 24" aria-hidden="true">
<circle cx="13.7" cy="4.2" r="1.75"/>
<path d="M12.1 7.2 9.7 10.4l2.45 2.05 1.15 3.15"/>
<path d="m12.1 7.2 2.65 2.1 2.8-.7"/>
<path d="m10.15 10.05-2.65 1.3"/>
<path d="m13.25 15.45-2.25 4.1"/>
<path d="m13.15 12.55 3.2 2.25 2.15 3.55"/>
</svg>Перемена ${gap} минут</span><span>${x.end}–${arr[i+1].start}</span>`;
       root.appendChild(b)
      }
   }
 });
 updateRealtimeStates();
}
function openEditor(i=null){
 editing=i;
 const x=i===null?{subject:"",start:"08:00",end:"08:45",room:"",homework:"",note:""}:(data[selected]||[])[i];
 ["subject","start","end","room","homework","note"].forEach(k=>document.getElementById(k).value=x[k]||"");
 document.getElementById("deleteBtn").style.display=i===null?"none":"block"; document.getElementById("duplicateBtn").style.display=i===null?"none":"block";
 document.getElementById("formTitle").textContent=i===null?"Добавить урок":"Изменить урок";
 document.getElementById("modal").classList.add("show")
}
function closeEditor(){document.getElementById("modal").classList.remove("show")}
function saveLesson(){
 let x={};["subject","start","end","room","homework","note"].forEach(k=>x[k]=document.getElementById(k).value.trim());
 if(!x.subject)return alert("Введи предмет");
 data[selected]=data[selected]||[];
 if(editing===null)data[selected].push(x);else x={...data[selected][editing],...x},data[selected][editing]=x;
 data[selected].sort((a,b)=>a.start.localeCompare(b.start));
 data[selected].forEach((x,i)=>x.n=i+1);
 persist();closeEditor();render()
}

function duplicateLesson(){
 if(editing===null)return;
 const original=(data[selected]||[])[editing];
 if(!original)return;
 const copy={...original,current:false};
 data[selected].splice(editing+1,0,copy);
 data[selected].forEach((x,i)=>x.n=i+1);
 persist();closeEditor();render();
}

function removeLesson(){
 if(editing===null)return;
 if(confirm("Удалить урок?")){data[selected].splice(editing,1);data[selected].forEach((x,i)=>x.n=i+1);persist();closeEditor();render()}
}
render();
setInterval(updateRealtimeStates,5000);
</script>
