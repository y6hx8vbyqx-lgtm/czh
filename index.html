<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Расписание</title>
<style>
:root{--bg:#09090b;--card:#202024;--card2:#2b2b30;--text:#f4f4f6;--muted:#9b9ba2;--blue:#5d78f2;--orange:#ff7900;--red:#ef5661}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.app{max-width:820px;margin:auto;min-height:100vh;padding:28px 30px 120px}
.top{display:flex;justify-content:space-between;align-items:center;margin:10px 0 30px}
.avatar{width:76px;height:76px;border-radius:50%;background:#8d3e00;display:grid;place-items:center;font-size:29px;font-weight:700}
.icons{font-size:30px;letter-spacing:12px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;text-align:center;color:var(--muted)}
.day{padding:8px 2px;border-radius:30px;cursor:pointer}.day b{display:block;font-size:20px;font-weight:500}.day span{display:inline-grid;place-items:center;width:52px;height:52px;font-size:26px;color:var(--text);margin-top:8px}
.day.active span{background:var(--blue);border-radius:50%}.day.sun span{color:var(--red)}
.actions{display:flex;gap:22px;margin:28px 0 15px}.btn{border:0;background:var(--card2);color:#fff;border-radius:14px;padding:14px 17px;font-size:22px;font-weight:650;cursor:pointer}.btn.add{margin-left:auto;background:#4058c9}
.lesson{background:var(--card);border-radius:28px;padding:30px 50px;margin:14px 0;position:relative;cursor:pointer}
.lesson.current{outline:3px solid #7e9cff}.meta{color:var(--muted);font-size:23px}.subject{font-size:27px;font-weight:750;margin:14px 0 40px}.hw-title{font-size:24px;font-weight:700;color:#b6b6bc;margin-bottom:10px}.hw{font-size:23px;color:var(--muted);line-height:1.4}.todo{font-size:22px;color:var(--muted);margin-top:10px}.todo.hot{color:var(--orange)}
.break{display:flex;justify-content:space-between;color:var(--muted);font-size:23px;padding:15px 5px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#2a2a2f;border-top:1px solid #49494d;height:105px;display:flex;justify-content:space-around;align-items:center;color:#aaa;z-index:3}.nav{text-align:center;font-size:15px}.nav i{display:block;font-style:normal;font-size:29px;margin-bottom:6px}.nav.active{color:#fff}
.empty{text-align:center;color:#777;padding:70px 20px;font-size:21px}
.modal{display:none;position:fixed;inset:0;background:#000a;z-index:10;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{width:min(820px,100%);background:#242429;border-radius:28px 28px 0 0;padding:25px 25px calc(25px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}.sheet h2{margin:0 0 20px}
label{display:block;color:#aaa;margin:13px 0 6px}input,textarea{width:100%;border:0;border-radius:12px;background:#34343a;color:#fff;padding:13px;font-size:18px}textarea{min-height:100px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.sheet-actions{display:flex;gap:10px;margin-top:20px}.danger{background:#9c3340}.grow{flex:1}
@media(max-width:600px){
.app{padding:17px 15px 94px}
.top{margin:4px 0 20px}
.avatar{width:39px;height:39px;font-size:16px}
.icons{font-size:20px;letter-spacing:8px}
.week{gap:1px}
.day{padding:4px 1px}
.day b{font-size:13px}
.day span{width:31px;height:31px;font-size:16px;margin-top:5px}
.actions{gap:11px;margin:16px 0 8px}
.btn{font-size:15px;padding:9px 11px;border-radius:9px}
.lesson{border-radius:17px;padding:17px 26px;margin:8px 0}
.meta{font-size:14px}
.subject{font-size:16px;margin:8px 0 24px}
.hw-title{font-size:15px;margin-bottom:7px}
.hw{font-size:14px;line-height:1.35}
.todo{font-size:14px;margin-top:7px}
.break{font-size:14px;padding:9px 3px}
.bottom{height:74px}
.nav{font-size:11px}
.nav i{font-size:20px;margin-bottom:4px}
}
</style>
</head>
<body>
<div class="app">
 <div class="top"><div class="avatar">ДИ</div><div class="icons">♧ ☰</div></div>
 <div class="week" id="week"></div>
 <div class="actions"><button class="btn">Сентябрь</button><button class="btn" onclick="selectToday()">Сегодня</button><button class="btn add" onclick="openEditor()">＋ урок</button></div>
 <main id="schedule"></main>
</div>
<div class="bottom">
 <div class="nav active"><i>▰</i>Расписание</div><div class="nav"><i>☆</i>Оценки</div><div class="nav"><i>✓</i>Задания</div><div class="nav"><i>⌘</i>Школа</div><div class="nav"><i>▱</i>Портфолио</div>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeEditor()">
 <div class="sheet">
  <h2 id="formTitle">Урок</h2>
  <label>Предмет</label><input id="subject">
  <div class="row"><div><label>Начало</label><input id="start" type="time"></div><div><label>Конец</label><input id="end" type="time"></div></div>
  <label>Кабинет</label><input id="room">
  <label>Домашнее задание</label><textarea id="homework"></textarea>
  <label>Количество заданий</label><input id="todo" type="number" min="0" value="1">
  <div class="sheet-actions"><button class="btn danger" id="deleteBtn" onclick="removeLesson()">Удалить</button><button class="btn" onclick="closeEditor()">Отмена</button><button class="btn add grow" onclick="saveLesson()">Сохранить</button></div>
 </div>
</div>

<script>
const weekDays=[["Пн",21],["Вт",22],["Ср",23],["Чт",24],["Пт",25],["Сб",26],["Вс",27]];
let selected=24, editing=null;
const defaults={
  24:[
   {subject:"География",start:"12:55",end:"13:40",room:"",homework:"Цифровое домашнее задание",todo:1},
   {subject:"Химия",start:"13:50",end:"14:35",room:"502",homework:"Закончить конспект параграфа №2 2) посчитать степени окисления элементов в оксидах калия, ст...",todo:1}
  ]
};
let data=JSON.parse(localStorage.getItem("mySchedule")||"null")||defaults;

function persist(){localStorage.setItem("mySchedule",JSON.stringify(data))}
function renderWeek(){
 const w=document.getElementById("week"); w.innerHTML="";
 weekDays.forEach(([name,n])=>{
  const d=document.createElement("div");d.className="day "+(n===selected?"active ":"")+(name==="Вс"?"sun":"");
  d.innerHTML=`<b>${name}</b><span>${n}</span>`;d.onclick=()=>{selected=n;render()};w.appendChild(d);
 });
}
function render(){
 renderWeek(); const root=document.getElementById("schedule"), arr=data[selected]||[];root.innerHTML="";
 if(!arr.length){root.innerHTML='<div class="empty">На этот день уроков нет.<br>Нажми «＋ урок», чтобы добавить.</div>';return}
 arr.forEach((x,i)=>{
   const card=document.createElement("div");card.className="lesson";
   card.innerHTML=`<div class="meta">${i+1} урок&nbsp;&nbsp; ${x.start} – ${x.end}${x.room?` &nbsp;каб. ${x.room}`:""}</div>
   <div class="subject">${esc(x.subject)}</div>
   <div class="hw-title">⌂ &nbsp;Домашнее задание</div><div class="hw">${esc(x.homework||"Нет домашнего задания")}</div>
   <div class="todo ${x.todo?"hot":""}">${x.todo||0} для выполнения</div>`;
   card.onclick=()=>openEditor(i);root.appendChild(card);
   if(i<arr.length-1){
    const mins=timeToMin(arr[i+1].start)-timeToMin(x.end);
    if(mins>=0){const b=document.createElement("div");b.className="break";b.innerHTML=`<span>🏃 Перемена ${mins} минут</span><span>${x.end}–${arr[i+1].start}</span>`;root.appendChild(b)}
   }
 });
}
function openEditor(i=null){
 editing=i;const x=i===null?{subject:"",start:"08:30",end:"09:15",room:"",homework:"",todo:1}:(data[selected]||[])[i];
 ["subject","start","end","room","homework","todo"].forEach(k=>document.getElementById(k).value=x[k]??"");
 document.getElementById("formTitle").textContent=i===null?"Добавить урок":"Изменить урок";
 document.getElementById("deleteBtn").style.display=i===null?"none":"block";
 document.getElementById("modal").classList.add("show");
}
function closeEditor(){document.getElementById("modal").classList.remove("show")}
function saveLesson(){
 const x={};["subject","start","end","room","homework"].forEach(k=>x[k]=document.getElementById(k).value.trim());x.todo=+document.getElementById("todo").value||0;
 if(!x.subject)return alert("Введи название предмета");
 data[selected]=data[selected]||[];
 if(editing===null)data[selected].push(x);else data[selected][editing]=x;
 data[selected].sort((a,b)=>a.start.localeCompare(b.start));persist();closeEditor();render();
}
function removeLesson(){if(editing===null)return;if(confirm("Удалить этот урок?")){data[selected].splice(editing,1);persist();closeEditor();render()}}
function selectToday(){selected=24;render()}
function timeToMin(s){const [h,m]=(s||"0:0").split(":").map(Number);return h*60+m}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
render();
</script>
</body>
</html>
